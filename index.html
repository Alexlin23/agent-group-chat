}

async function executeFlow(flowId) {
  const inputText = document.getElementById('flow-run-input').value.trim();
  if (!inputText) return;
  const btn = document.getElementById('flow-run-btn');
  btn.disabled = true;
  btn.textContent = '执行中...';
  try {
    const result = await api.post('/api/workflows/' + flowId + '/run', { input_text: inputText });
    closeRunModal();
    const runId = result.run_id;
    const flow = flowState.currentFlow;
    // Switch to execution view with graph
    switchToFlowView('exec');
    document.getElementById('flow-title').textContent = flow.name;
    document.getElementById('flow-meta').innerHTML =
      '<span class="meta-item" style="color:var(--accent)">⚡ 正在执行...</span>';
    document.getElementById('flow-actions').innerHTML = '';
    const backBtn = document.getElementById('flow-back-btn');
    backBtn.onclick = backToFlowGraph;
    // Build graph with execution indicators
    renderFlowGraph(flow);
    // Add exec status dots to nodes
    if (flow.nodes) {
      for (const s of flow.nodes) {
        const node = document.querySelector('.flow-node[data-step-id="' + s.id + '"]');
        if (node) {
          const dot = document.createElement('div');
          dot.className = 'flow-node-exec waiting';
          dot.id = 'exec-dot-' + s.id;
          node.appendChild(dot);
        }
      }
    }
    // Build output panel
    let outputHtml = '<div style="margin-top:32px;max-width:' + (flow.nodes.length * 280 + 80) + 'px;margin-left:auto;margin-right:auto">';
    if (flow.nodes) {
      for (let i = 0; i < flow.nodes.length; i++) {
        const s = flow.nodes[i];
        const agent = state.agents.find(a => a.id === s.agent_id);
        const agentColor = agent ? agent.color : '#888';
        const agentAvatar = agent ? agent.avatar : '🤖';
        const agentName = agent ? agent.name : s.agent_id;
        outputHtml +=
          '<div class="exec-step" id="exec-step-' + s.id + '">' +
            '<div class="step-header">' +
              '<span class="exec-status waiting" id="exec-status-' + s.id + '"></span>' +
              '<span class="step-agent"><span class="agent-dot" style="background:' + agentColor + '"></span>' + agentAvatar + ' ' + esc(agentName) + '</span>' +
              '<span class="step-name" style="margin-left:auto;font-size:12px;color:var(--text-dim)">' + esc(s.name || 'Step ' + (i+1)) + '</span>' +
            '</div>' +
            '<div class="exec-output" id="exec-output-' + s.id + '" style="display:none"></div>' +
          '</div>';
      }
    }
    outputHtml += '</div>';
    document.getElementById('flow-body').insertAdjacentHTML('beforeend', outputHtml);
    connectFlowStream(runId);
  } catch (e) {
    alert('执行失败: ' + (e.message || e));
    btn.disabled = false;
    btn.textContent = '▶ 开始执行';
  }
}

function backToFlowGraph() {
  const flow = flowState.currentFlow;
  if (flow) showFlowDetail(flow);
}

function connectFlowStream(runId) {
  const es = new EventSource('/api/workflows/runs/' + runId + '/stream?last_id=-1');
  es.addEventListener('step_start', function(e) {
    const d = JSON.parse(e.data);
    const statusEl = document.getElementById('exec-status-' + d.step_id);
    const stepEl = document.getElementById('exec-step-' + d.step_id);
    const outputEl = document.getElementById('exec-output-' + d.step_id);
    const dotEl = document.getElementById('exec-dot-' + d.step_id);
    if (statusEl) statusEl.className = 'exec-status running';
    if (stepEl) stepEl.className = 'exec-step running';
    if (dotEl) dotEl.className = 'flow-node-exec running';
    if (outputEl) { outputEl.style.display = 'block'; outputEl.innerHTML = ''; }
  });
  es.addEventListener('step_text', function(e) {
    const d = JSON.parse(e.data);
    const outputEl = document.getElementById('exec-output-' + d.step_id);
    if (outputEl) {
      const cursor = outputEl.querySelector('.streaming-cursor');
      if (cursor) cursor.remove();
      outputEl.textContent += d.text;
      const newCursor = document.createElement('span');
      newCursor.className = 'streaming-cursor';
      outputEl.appendChild(newCursor);
      outputEl.scrollTop = outputEl.scrollHeight;
    }
  });
  es.addEventListener('step_done', function(e) {
    const d = JSON.parse(e.data);
    const statusEl = document.getElementById('exec-status-' + d.step_id);
    const stepEl = document.getElementById('exec-step-' + d.step_id);
    const outputEl = document.getElementById('exec-output-' + d.step_id);
    const dotEl = document.getElementById('exec-dot-' + d.step_id);
    if (statusEl) statusEl.className = 'exec-status completed';
    if (stepEl) stepEl.className = 'exec-step completed';
    if (dotEl) dotEl.className = 'flow-node-exec completed';
    if (outputEl) { const c = outputEl.querySelector('.streaming-cursor'); if (c) c.remove(); }
  });
  es.addEventListener('step_error', function(e) {
    const d = JSON.parse(e.data);
    const statusEl = document.getElementById('exec-status-' + d.step_id);
    const stepEl = document.getElementById('exec-step-' + d.step_id);
    const outputEl = document.getElementById('exec-output-' + d.step_id);
    const dotEl = document.getElementById('exec-dot-' + d.step_id);
    if (statusEl) statusEl.className = 'exec-status failed';
    if (stepEl) stepEl.className = 'exec-step failed';
    if (dotEl) dotEl.className = 'flow-node-exec failed';
    if (outputEl) { outputEl.style.display = 'block'; outputEl.innerHTML = '<span style="color:var(--danger)">Error: ' + esc(d.error || 'Unknown') + '</span>'; }
  });
  es.addEventListener('flow_done', function() {
    es.close();
    const metaEl = document.getElementById('flow-meta');
    if (metaEl) metaEl.innerHTML = '<span class="meta-item" style="color:var(--success)">✓ 执行完成</span>';
    const actionsEl = document.getElementById('flow-actions');
    if (actionsEl) actionsEl.innerHTML = '<button class="flow-run-btn" onclick="showRunModal()">▶ 重新执行</button>';
    const backBtn = document.getElementById('flow-back-btn');
    if (backBtn) backBtn.onclick = backToFlowGraph;
  });
  es.addEventListener('flow_error', function() {
    es.close();
    const metaEl = document.getElementById('flow-meta');
    if (metaEl) metaEl.innerHTML = '<span class="meta-item" style="color:var(--danger)">✕ 执行失败</span>';
    const actionsEl = document.getElementById('flow-actions');
    if (actionsEl) actionsEl.innerHTML = '<button class="flow-run-btn" onclick="showRunModal()">▶ 重新执行</button>';
  });
  es.addEventListener('error', function() {
    es.close();
    const metaEl = document.getElementById('flow-meta');
    if (metaEl) metaEl.innerHTML = '<span class="meta-item" style="color:var(--danger)">✕ 连接中断</span>';
    const actionsEl = document.getElementById('flow-actions');
    if (actionsEl) actionsEl.innerHTML = '<button class="flow-run-btn" onclick="showRunModal()">▶ 重新执行</button>';
  });
}

async function deleteFlow(flowId) {
  if (!confirm('确定删除此流程？')) return;
  try {
    await api.del('/api/workflows/' + flowId);
    flowState.flows = flowState.flows.filter(f => f.id !== flowId);
    if (flowState.currentFlow && flowState.currentFlow.id === flowId) backToChat();
    renderFlowList();
  } catch (e) { alert('删除失败: ' + (e.message || e)); }
}
